name: Browser

# The browser gate, and the awkward one of the three.
#
# Gen-gen models generators *for* a target, and the target these specs use is
# Exten-gen: the generators list is empty until something publishes a
# vocabulary, and the seeded generator is Exten-gen's own. So this needs two
# components on one Joomla, which is exactly how they are used and exactly what
# no other check here arranges.
#
# `CI` already checks Exten-gen out beside this one for the acceptance
# comparison, and honours `EXTENGEN_PATH` to find it. The same variable now
# tells the tools which site to act on, so the specs can keep calling them with
# no arguments and still reach the right Joomla.
#
# Separate from `CI` because it is the slow one and because it can fail for
# reasons about the runner rather than the code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: joomla
          MYSQL_DATABASE: joomla_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pjoomla"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      JOOMLA_VERSION: 6.1.3
      SITE_URL: http://127.0.0.1:8080
      # A Super User for this run only. Joomla requires twelve characters.
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-password-for-one-run
      # Where Exten-gen is, which is also where the site is. The tools read it.
      EXTENGEN_PATH: ${{ github.workspace }}/target/Exten-gen

    steps:
      - uses: actions/checkout@v5

      # The target these generators are written for. Its `main`, deliberately:
      # a generator that no longer reproduces what Exten-gen does today is the
      # thing this repository exists to notice.
      - name: Check out Exten-gen, which is the target
        uses: actions/checkout@v5
        with:
          repository: HermanPeeren/Exten-gen
          path: target/Exten-gen

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mysqli, pdo_mysql, intl, gd, mbstring, simplexml
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Cypress
        run: npm ci

      - name: Fetch Joomla
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p "${EXTENGEN_PATH}/joomla"
          tar -xzf joomla.tar.gz -C "${EXTENGEN_PATH}/joomla"

      - name: Install Joomla
        working-directory: target/Exten-gen
        run: |
          php joomla/installation/joomla.php install \
            --site-name="Gen-gen CI" \
            --admin-user="CI" \
            --admin-username="${ADMIN_USERNAME}" \
            --admin-password="${ADMIN_PASSWORD}" \
            --admin-email="ci@example.invalid" \
            --db-type=mysqli \
            --db-host=127.0.0.1 \
            --db-user=root \
            --db-pass=joomla \
            --db-name=joomla_ci \
            --db-prefix=ci_ \
            --no-interaction

      # Joomla works its own root out from the request, and under PHP's built-in
      # server it decides the root *is* /administrator - so the login lands on
      # /administrator/administrator/index.php and every asset 404s. `$live_site`
      # is the override for exactly that.
      - name: Tell Joomla where it lives
        run: |
          sed -i "s|public \$live_site = '';|public \$live_site = '${SITE_URL}';|" "${EXTENGEN_PATH}/joomla/configuration.php"
          grep -q "live_site = '${SITE_URL}'" "${EXTENGEN_PATH}/joomla/configuration.php" || {
            echo "live_site was not set - the default line has changed shape"
            exit 1
          }

      - name: Serve the site
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -d display_errors=1 -d error_reporting=-1 -S 127.0.0.1:8080 -t "${EXTENGEN_PATH}/joomla" > php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null "${SITE_URL}/administrator/"; then
              echo "serving after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the site never came up"
          cat php-server.log
          exit 1

      - name: Point Cypress at it
        run: |
          cat > cypress.env.json <<JSON
          {
            "baseUrl": "${SITE_URL}",
            "adminUser": "${ADMIN_USERNAME}",
            "adminPassword": "${ADMIN_PASSWORD}"
          }
          JSON

      # Exten-gen first, because it is what publishes the `joomla6` vocabulary
      # the generators list shows and the seeded generator is written for. Its
      # own scripts, run directly: `composer install-local` there would want its
      # dependencies installed, and nothing in this job needs them.
      - name: Install the target component
        working-directory: target/Exten-gen
        run: |
          php build/update-xml.php
          php build/build.php
          php tools/install-local.php

      - name: Install this component
        run: composer install-local

      # A fresh Joomla starts a guided tour, and a tour navigates: two seconds
      # after a spec opens a list the browser is on the Home Dashboard with
      # everything the spec was about gone. The statistics plugin asks the
      # administrator a question on first sight, over the page under test.
      - name: Quieten a fresh Joomla
        run: |
          mysql -h 127.0.0.1 -uroot -pjoomla joomla_ci -e "UPDATE ci_extensions SET enabled = 0 WHERE type = 'plugin' AND element IN ('guidedtours', 'stats');"

      # One generator to look at, which is Exten-gen's own - the same one the
      # acceptance check runs. `component-renders.cy.js` asserts the list has
      # rows and names a target, and it seeds nothing itself.
      - name: Seed a generator
        run: php tools/seed-generator.php

      - name: Browser tests
        run: npx cypress run

      - name: What it saw when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: tests/cypress/screenshots
          if-no-files-found: ignore

      # Not a tail: the interesting line is usually in the first spec and a
      # tail shows the last one's asset requests. The whole log goes up as an
      # artifact too, because a grep only finds what it was told to look for.
      - name: What the server said
        if: failure()
        run: |
          echo '--- anything that looks like a failure ---'
          grep -inE 'fatal|uncaught|exception|error|warning|\[500\]' php-server.log | head -50 || true
          echo '--- last 30 lines ---'
          tail -30 php-server.log

      - name: The whole server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-log
          path: php-server.log
          if-no-files-found: ignore
